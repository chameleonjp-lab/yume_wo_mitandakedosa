name: Validate and publish Yume wo mitandakedosa Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'push' && 'production' || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.repository == 'chameleonjp-lab/yume_wo_mitandakedosa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify static game and social metadata offline
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          node --test tests/*.cjs
      - name: Build only the approved public runtime files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          site="$(mktemp -d "$RUNNER_TEMP/game-pages.XXXXXX")"
          files=( index.html i18n-dictionary.js i18n-runtime.js common-state.js share.js audio.js normal-score-ack8.js social-card.jpg )
          for file in "${files[@]}"; do
            if [[ ! -f "$file" || ! -s "$file" || -L "$file" ]]; then
              echo "Runtime file must be nonempty, regular, and not a symlink: $file" >&2
              exit 1
            fi
            install -m 0644 -- "$file" "$site/$file"
            cmp -- "$file" "$site/$file"
          done
          test "$(find "$site" -type f | wc -l)" -eq "${#files[@]}"
          printf 'path=%s\n' "$site" >> "$GITHUB_OUTPUT"
      - name: Upload only the verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ steps.package.outputs.path }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chameleonjp-lab/yume_wo_mitandakedosa'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$EXPECTED_SHA"
      - name: Deploy only the artifact verified from this commit
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
